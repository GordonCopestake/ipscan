name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # The macOS and Windows backends are behind `cfg`, so nothing but a
      # cross-target check proves they still compile. This is the only automated
      # signal that the Win32 FFI has not rotted.
      - name: Check
        run: cargo check --locked --target ${{ matrix.target }} --all-targets

      - name: Clippy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Format
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --check

      - name: "Check imported entry points exist in the DLLs"
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class PE {
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Ansi)]
            public static extern IntPtr LoadLibrary(string p);
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Ansi)]
            public static extern IntPtr GetProcAddress(IntPtr h, string n);
            [DllImport("kernel32", SetLastError=true, CharSet=CharSet.Ansi)]
            public static extern IntPtr GetProcAddress(IntPtr h, IntPtr ordinal);
          }
          "@
          $want = [ordered]@{
            'netapi32.dll' = @('NetApiFreeMemory')
            'ws2_32.dll'   = @('GetAddrInfoExW','FreeAddrInfoExW','getaddrinfo','freeaddrinfo')
            'iphlpapi.dll' = @('SendARP','GetIpNetTable2','IcmpSendEcho2')
          }
          foreach ($dll in $want.Keys) {
            $full = Join-Path $env:SystemRoot "System32\$dll"
            if (-not (Test-Path $full)) { "MISSING DLL $dll"; continue }
            $h = [PE]::LoadLibrary($full)
            "=== $dll handle=$h ==="
            foreach ($fn in $want[$dll]) {
              "  name $fn -> " + [PE]::GetProcAddress($h, $fn)
            }
          }
          # The ws2_32 import descriptor also uses ordinals; check those too.
          $h2 = [PE]::LoadLibrary((Join-Path $env:SystemRoot 'System32\ws2_32.dll'))
          foreach ($ord in 273, 165) {
            "  ws2_32 ordinal $ord -> " + [PE]::GetProcAddress($h2, [IntPtr]$ord)
          }

      # Unit tests need no external network beyond loopback, so they run on
      # every platform to cover the native probe backends too.
      - name: Test
        run: cargo test --locked

  package:
    name: Package sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Confirms `cargo package` can build the crate as published, which catches
      # a missing file reference in Cargo.toml (such as `readme`) before a tag.
      - run: cargo package --locked
