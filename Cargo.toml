[package]
name = "ipscan"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, cross-platform network scanner that finds alive hosts on a LAN"
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["network-programming", "command-line-utilities"]
keywords = ["network", "scanner", "ping", "arp", "lan", "discovery"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
if-addrs = "0.15.0"
polling = "3.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
